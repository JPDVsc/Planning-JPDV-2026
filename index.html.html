html<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning 2026 + Export CSV</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f1117; font-family: sans-serif; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .btn-export { background: #48bb78; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-export:hover { background: #38a169; }
        table { width: 100%; border-collapse: collapse; background: #1a1f2e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #2d3748; }
        th { background: #252d3d; font-size: 12px; color: #a0aec0; }
        .weekend { background: #131720; }
        input { background: #0a1628; border: 1px solid #2c4a6a; color: #90cdf4; padding: 5px; border-radius: 4px; width: 65px; text-align: center; }
        .total-cell { font-weight: bold; color: #68d391; }
        select { background: #1a1f2e; color: white; padding: 8px; border-radius: 5px; border: 1px solid #4a5568; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const MONTHS = [
            { name: "Janvier", days: 31, startDay: 4 }, { name: "Février", days: 28, startDay: 0 },
            { name: "Mars", days: 31, startDay: 0 }, { name: "Avril", days: 30, startDay: 3 },
            { name: "Mai", days: 31, startDay: 5 }, { name: "Juin", days: 30, startDay: 1 },
            { name: "Juillet", days: 31, startDay: 3 }, { name: "Août", days: 31, startDay: 6 },
            { name: "Septembre", days: 30, startDay: 2 }, { name: "Octobre", days: 31, startDay: 4 },
            { name: "Novembre", days: 30, startDay: 0 }, { name: "Décembre", days: 31, startDay: 2 }
        ];
        const JOURS = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];

        function timeToMinutes(t) {
            if (!t || !t.includes(':')) return 0;
            const [h, m] = t.split(":").map(Number);
            return (h * 60) + (m || 0);
        }

        function minutesToTime(mins) {
            if (mins <= 0) return "-";
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h}h${String(m).padStart(2, "0")}`;
        }

        function App() {
            const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem("planning_2026_v2");
                return saved ? JSON.parse(saved) : MONTHS.map(m => Array(m.days).fill({ mArr: "", mDep: "", aArr: "", aDep: "" }));
            });

            useEffect(() => { localStorage.setItem("planning_2026_v2", JSON.stringify(data)); }, [data]);

            const handleChange = (dayIdx, field, val) => {
                const newData = [...data];
                newData[currentMonth][dayIdx] = { ...newData[currentMonth][dayIdx], [field]: val };
                setData(newData);
            };

            const calculateDayTotal = (day) => {
                const m = Math.max(0, timeToMinutes(day.mDep) - timeToMinutes(day.mArr));
                const a = Math.max(0, timeToMinutes(day.aDep) - timeToMinutes(day.aArr));
                return m + a;
            };

            const exportToCSV = () => {
                let csv = "Mois;Jour;Matin Arrivee;Matin Depart;Aprem Arrivee;Aprem Depart;Total\n";
                data.forEach((monthDays, mIdx) => {
                    monthDays.forEach((day, dIdx) => {
                        const total = minutesToTime(calculateDayTotal(day));
                        if (total !== "-") {
                            csv += `${MONTHS[mIdx].name};${dIdx + 1};${day.mArr};${day.mDep};${day.aArr};${day.aDep};${total}\n`;
                        }
                    });
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", "planning_2026.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const monthTotal = data[currentMonth].reduce((acc, day) => acc + calculateDayTotal(day), 0);

            return (
                <div className="container">
                    <div className="nav-bar">
                        <h2>Planning 2026</h2>
                        <select value={currentMonth} onChange={(e) => setCurrentMonth(parseInt(e.target.value))}>
                            {MONTHS.map((m, i) => <option key={i} value={i}>{m.name}</option>)}
                        </select>
                        <span className="total-cell">Mois: {minutesToTime(monthTotal)}</span>
                        <button className="btn-export" onClick={exportToCSV}>Exporter CSV</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Jour</th><th>Matin Arr</th><th>Matin Dep</th><th>Aprem Arr</th><th>Aprem Dep</th><th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            {data[currentMonth].map((day, i) => {
                                const isWk = (MONTHS[currentMonth].startDay + i) % 7 === 0 || (MONTHS[currentMonth].startDay + i) % 7 === 6;
                                return (
                                    <tr key={i} className={isWk ? "weekend" : ""}>
                                        <td>{JOURS[(MONTHS[currentMonth].startDay + i) % 7]} {i + 1}</td>
                                        <td><input value={day.mArr} onChange={e => handleChange(i, 'mArr', e.target.value)} placeholder="08:00" /></td>
                                        <td><input value={day.mDep} onChange={e => handleChange(i, 'mDep', e.target.value)} placeholder="12:00" /></td>
                                        <td><input value={day.aArr} onChange={e => handleChange(i, 'aArr', e.target.value)} placeholder="13:00" /></td>
                                        <td><input value={day.aDep} onChange={e => handleChange(i, 'aDep', e.target.value)} placeholder="17:00" /></td>
                                        <td className="total-cell">{minutesToTime(calculateDayTotal(day))}</td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
